x-platform-environment: &platform-environment
  ACOUSTIC_ENVIRONMENT: ${ACOUSTIC_ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://acoustic:${POSTGRES_PASSWORD:-acoustic-dev}@postgres:5432/acoustic
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  API_KEY_PEPPER: ${API_KEY_PEPPER:-development-only-api-key-pepper}
  ACOUSTIC_STORAGE_BACKEND: ${ACOUSTIC_STORAGE_BACKEND:-local}
  ACOUSTIC_STORAGE_LOCAL_PATH: /app/var/storage
  ACOUSTIC_STORAGE_S3_BUCKET: ${ACOUSTIC_STORAGE_S3_BUCKET:-}
  ACOUSTIC_STORAGE_S3_ENDPOINT_URL: ${ACOUSTIC_STORAGE_S3_ENDPOINT_URL:-}
  ACOUSTIC_STORAGE_S3_REGION: ${ACOUSTIC_STORAGE_S3_REGION:-us-east-1}
  ACOUSTIC_STORAGE_S3_ACCESS_KEY_ID: ${ACOUSTIC_STORAGE_S3_ACCESS_KEY_ID:-}
  ACOUSTIC_STORAGE_S3_SECRET_ACCESS_KEY: ${ACOUSTIC_STORAGE_S3_SECRET_ACCESS_KEY:-}
  ACOUSTIC_STORAGE_RECONCILE_INTERVAL_SECONDS: ${ACOUSTIC_STORAGE_RECONCILE_INTERVAL_SECONDS:-3600}
  ACOUSTIC_STORAGE_PENDING_MAX_AGE_SECONDS: ${ACOUSTIC_STORAGE_PENDING_MAX_AGE_SECONDS:-3600}
  ACOUSTIC_CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://localhost:8000"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acoustic
      POSTGRES_USER: acoustic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acoustic-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acoustic -d acoustic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment: *platform-environment
    volumes:
      - platform_storage:/app/var/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "worker.main"]
    environment: *platform-environment
    volumes:
      - platform_storage:/app/var/storage
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  platform_storage:
